default: { color: "#757575", line_width: 2.5, icon: "http://maps.google.com/mapfiles/kml/shapes/shaded_dot.png", icon_scale: 0.3, label_scale: 0.7, polygon_opacity: 0.5 }
# Árbol de carpetas (por nombre o slug). En cada nodo:
#   styles: estilo para todo lo que está debajo
#   depth:  cuántos niveles por debajo de esa carpeta se guardan como directorios
folders:
  Ferromapas:
    Ferrocarriles Argentinos:
      Ferrocarril Belgrano:   { styles: { color: "#D30000" }, depth: 2 }  # Línea > Ramal > subcarpetas
      Ferrocarril Mitre:      { styles: { color: "#00FF00" } }
      Ferrocarril Roca:       { styles: { color: "#FF00FF" }, depth: 2 }  # Zona > tramo > subcarpetas
      Ferrocarril San Martín: { styles: { color: "#0055FF" } }
      Ferrocarril Sarmiento:  { styles: { color: "#FFAAFF" } }
      Ferrocarril Urquiza:    { styles: { color: "#55FFFF" } }
      Otros Ferrocarriles:    { styles: { color: "#FF5500" } }
      Proyectos:              { styles: { color: "#FFFF00" } }
    Ferrocarriles de Chile:   { styles: { color: "#D30000" } }
